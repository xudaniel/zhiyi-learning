name: Verify learning app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  learning-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:check
      # The deployed artifact is checked above. This temporary fixture build is never published.
      - run: pnpm run build
        env:
          ZHIYI_COURSE_PASSWORD: ci-learning-test-only
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
        env:
          ZHIYI_COURSE_PASSWORD: ci-learning-test-only
