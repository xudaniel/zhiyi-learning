const LESSONS=[{"title":"先认识这门课","tag":"易经启蒙","minutes":5,"lead":"先背熟基本语言，再从四柱案例入手。这是老师课程反复强调的顺序。","parts":[["《易经》与《易传》","讲稿把《周易》分为经文与传文。经文包括六十四卦的卦画、卦名、卦辞和爻辞；《易传》是理解经文的重要传统文献。"],["这套课程怎么走","先读懂阴阳、干支和五行，再读四柱，最后接触大运、流年和口诀。八字和风水是本课程涉及的传统术数，不等于《周易》经文本身。"],["先会识别，再学解释","学习的第一目标是准确找出一个字的位置、类别和关系。暂时不需要从一个字推断一个人的人生。"]],"tip":"先背得滚瓜烂熟，再看四柱，用案例反复练习。","source":"讲稿总结 §二、§十一；讲稿第4–11页（页码据总结）","qs":[{"q":"本课程建议先学习什么？","opts":["大量吉凶断语","干支、阴阳与五行","给人预测财富"],"a":1,"why":"老师先要求熟记基本语言，才能读懂后面的案例。"},{"q":"六十四卦的卦画、卦辞主要属于什么？","opts":["经文","大运表","生肖表"],"a":0,"why":"讲稿将卦画、卦名、卦辞和爻辞归入经文。"}],"lab":"stems"},{"title":"阴阳，先学会区分","tag":"易经启蒙","minutes":5,"lead":"把阴阳当作传统分类的两个类别，先练辨认。","parts":[["十天干中的阴阳","甲、丙、戊、庚、壬为阳；乙、丁、己、辛、癸为阴。按顺序读时，阳阴交替。"],["用一对画面记住","甲是大树，乙是花草；丙是太阳，丁是小火。这些画面是老师帮助记忆的类比。"],["阴阳回到天干里学","按老师的讲解，先记甲阳乙阴、丙阳丁阴，再依次记戊己、庚辛、壬癸。和五行、物象放在一起记。"]],"tip":"甲乙一组，前阳后阴；其他四组也一样。","source":"第二节课资料 §二、§五","qs":[{"q":"以下哪个是阳干？","opts":["乙","丁","甲"],"a":2,"why":"甲为阳木，乙为阴木。"},{"q":"丁的阴阳是？","opts":["阴","阳"],"a":0,"why":"丙丁属火，丙阳、丁阴。"}],"lab":"stems"},{"title":"十天干：把字变成画面","tag":"干支基础","minutes":8,"lead":"大树、花草、太阳、灯火……用老师的画面来记。","parts":[["先背五组","甲乙木，丙丁火，戊己土，庚辛金，壬癸水。"],["木、火、土","甲：参天大树；乙：花草藤蔓。丙：太阳；丁：小火。戊：高山；己：田园之土。"],["金、水","庚：毛坯金属；辛：加工精细的金属。壬：大海江河；癸：细雨。物象是记忆工具，不是物体的严格科学分类。"]],"tip":"先按五行分组，再在每组里区分阴阳。","source":"第二节课资料 §一、§二、§五","qs":[{"q":"“田园之土”帮助记住哪个天干？","opts":["戊","己","辛"],"a":1,"why":"老师用高山记戊，用田园记己。"},{"q":"壬与癸共同属于？","opts":["金","木","水"],"a":2,"why":"壬为阳水，癸为阴水。"}],"lab":"stems"},{"title":"十二地支：先顺着读","tag":"干支基础","minutes":8,"lead":"把十二个字和熟悉的生肖连起来。","parts":[["顺序","子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥。"],["生肖对应","子鼠、丑牛、寅虎、卯兔、辰龙、巳蛇、午马、未羊、申猴、酉鸡、戌狗、亥猪。"],["地支的五行","寅卯木，巳午火，申酉金，亥子水；辰戌丑未土。这里先认识基本归类，地支藏干留待后续。"]],"tip":"先默写前六支，再默写后六支。","source":"第二节课资料 §五、§七；讲稿总结 §三、§四","qs":[{"q":"“午”对应哪一个生肖？","opts":["鼠","马","羊"],"a":1,"why":"午马，未羊。不要把午和未混淆。"},{"q":"下列哪组地支属木？","opts":["寅卯","申酉","亥子"],"a":0,"why":"寅卯木，申酉金，亥子水。"}],"lab":"branches"},{"title":"五行：相生与相克","tag":"五行关系","minutes":8,"lead":"两条循环，读懂五行之间的关系。","parts":[["相生顺序","木生火，火生土，土生金，金生水，水生木。首尾相接。"],["相克顺序","木克土，土克水，水克火，火克金，金克木。"],["先记关系，暂不判断好坏","“生”和“克”是体系里的关系。老师后续还会结合日元、季节等讨论喜忌，不能仅见“克”就判断不利。"]],"tip":"相生顺着走：木火土金水；相克另记：木土水火金。","source":"讲稿总结 §四；讲稿第22–26页（页码据总结）","qs":[{"q":"金生什么？","opts":["木","火","水"],"a":2,"why":"相生循环：木→火→土→金→水→木。"},{"q":"木克什么？","opts":["土","水","火"],"a":0,"why":"木克土；木生火，要区分两条关系。"}],"lab":"elements"},{"title":"四柱：根、枝、花、果","tag":"八字四柱","minutes":8,"lead":"四个栏目，每栏两个字，加起来就是八字。","parts":[["年、月、日、时","年柱、月柱、日柱、时柱各由一个天干和一个地支组成。上面看天干，下面看地支。"],["用树记住栏目","老师用年为根、月为枝、日为花、时为果帮助记忆。在传统解读中，分别联系祖辈、父母事业、本人伴侣、子女下属等主题。"],["先读图，不急着排盘","现在先熟悉四柱的布局。把出生时间换成干支需要历法规则，本练习使用教学示例，不用示例代替你的真实命盘。"]],"tip":"四柱 × 每柱两个字 = 八字。","source":"第二节课资料 §八（一）；讲稿总结 §三","qs":[{"q":"八字一共由几柱组成？","opts":["二柱","四柱","八柱"],"a":1,"why":"年、月、日、时四柱，每柱两个字。"},{"q":"“花”帮助记住哪一柱？","opts":["日柱","年柱","时柱"],"a":0,"why":"根、枝、花、果对应年、月、日、时。"}],"lab":"pillars"},{"title":"找到日元：从这里开始","tag":"八字四柱","minutes":6,"lead":"先找日柱，再找它上面的那个字。","parts":[["日元就是日干","日元也叫日主，是日柱的天干。不是年干，也不是整个日柱。"],["读法练习","若日柱写“壬午”，壬是日干，也是日元；午是日支。"],["下一步做什么","确定日元后，先看它的五行，再查看出生月份和季节。不要只依据生肖分析整张盘。"]],"tip":"日柱上面的字，就是日元。","source":"第二节课资料 §八（一）、§八（四）","qs":[{"q":"日柱是“壬午”，日元是？","opts":["壬","午","壬午"],"a":0,"why":"日元是日柱天干，因此是壬。"},{"q":"找日元时首先定位哪里？","opts":["年柱","日柱","时柱"],"a":1,"why":"先找日柱，再找日干。"}],"lab":"pillars"},{"title":"五行清点与季节","tag":"八字四柱","minutes":8,"lead":"能数清楚是第一步，但数量不等于旺衰。","parts":[["先给八个字分类","用十天干、十二地支表，把每个字归入五行。初学的计数只练基本分类，不计地支藏干。"],["再看季节","讲稿关联木与春、火与夏、金与秋、水与冬；土的季节归类在现有总结中不够细，本版不据此做旺衰计算。"],["为什么不是缺什么就补什么","老师会先找日元，再看月份与季节，之后才讨论用神和喜神。不能只按出现次数定喜忌。"]],"tip":"五行计数是识字练习，不是用神结论。","source":"第二节课资料 §八（四）–（五）；讲稿总结 §四、§五","qs":[{"q":"判断喜忌只数五行数量够吗？","opts":["够，最少的就是用神","不够，还要看日元和季节"],"a":1,"why":"课程强调日元和出生月份，同一日元在不同月份讨论不同。"},{"q":"讲稿把秋季主要对应到？","opts":["木","金","火"],"a":1,"why":"木春、火夏、金秋、水冬。"}],"lab":"elements"},{"title":"六冲：把前后两排对起来","tag":"关系入门","minutes":7,"lead":"先准确配对，再学习关系如何放进案例。","parts":[["六组对应","子午、丑未、寅申、卯酉、辰戌、巳亥。"],["老师的记法","上排写子丑寅卯辰巳，下排写午未申酉戌亥，上下对应就是六冲。"],["读关系要看位置","不能只看生肖。还要分清比较的是哪两柱，或命局与哪一个流年。识别“冲”不代表已经知道具体事件。"]],"tip":"两排各六字，上下连起来。","source":"第二节课资料 §七；讲稿总结 §三","qs":[{"q":"卯与哪个地支相冲？","opts":["申","酉","戌"],"a":1,"why":"卯酉冲，对应兔与鸡。"},{"q":"丑未冲的生肖是？","opts":["牛与羊","虎与猴","蛇与猪"],"a":0,"why":"丑牛、未羊。"}],"lab":"branches"},{"title":"命局、大运、流年","tag":"进阶准备","minutes":6,"lead":"先分清三种时间尺度，不急着独立起运。","parts":[["命局","出生年、月、日、时形成的四柱结构，是课程讨论的基础。"],["大运与流年","大运通常以约十年为一个阶段；流年指某个具体年份的干支。"],["起运另有计算","讲稿涉及顺逆排、节气与起运年龄。现有总结不足以完整实现独立起运，本版先练概念区分。"]],"tip":"命局是基础表，大运是阶段，流年是具体一年。","source":"讲稿总结 §六；第二节课资料 §九（一）","qs":[{"q":"“流年”指什么？","opts":["一天","具体某一年","约十年阶段"],"a":1,"why":"流年是某个具体年份的干支及课程中的相应解释。"},{"q":"大运通常以多长为一段？","opts":["约十年","一个月","一小时"],"a":0,"why":"讲稿以约十年为一个阶段。起运年龄需要另外计算。"}],"lab":"pillars"},{"title":"风水第一步：五行与方位","tag":"风水基础","minutes":8,"lead":"先建立方位语言，读懂老师后面讲的位置。","parts":[["五行方位图","木在东，火在南，金在西，水在北，土在中央。以下互动图采用上北下南，并明确标出方向。"],["先知道图怎么放","看图时先找北，不把屏幕上方自动当成北。转动示意图后，仍要按标出的方位辨认。"],["本课程目前学到哪里","现有材料有五行方位及文昌、楼层等应用线索，但还没有足够完整的住宅风水操作课。本版先做对应练习，不输出住宅吉凶或摆放结论。"]],"tip":"东木、南火、西金、北水、中央土。","source":"讲稿总结 §四（五行与方位）、§八；讲稿第44–65、77–84页（页码据总结）","qs":[{"q":"东方对应哪一行？","opts":["金","木","水"],"a":1,"why":"东方木，西方金。"},{"q":"图旋转以后应该根据什么辨方向？","opts":["永远把屏幕上方当北","图上明确标出的北向"],"a":1,"why":"先确认方位标识，避免把画面位置当成实际方向。"}],"lab":"compass"},{"title":"口诀入门：查法比死背重要","tag":"进阶准备","minutes":7,"lead":"每条口诀都写清楚“从哪里起、到哪里查”。","parts":[["四个格子","记录起点、查找对象、结果和解释。先掌握查表逻辑，再记传统含义。"],["按文昌诀实际查一次","讲义第77页明确写“以日元为主，年干为辅”。日元壬查寅、年干甲查巳。进入「施老师教法」第7步，练习起点、目标与命中柱位，并查看原页。"],["保留不确定处","课程资料标注“待核内容”的句子，不作为本版考题或计算规则。神煞的传统解释不能当成必然发生的事件。"]],"tip":"先问：这条口诀用天干起查，还是地支起查？","source":"施老师讲义第77页（文昌诀，已对照原页）；第二节课资料 §八","qs":[{"q":"记录口诀时最先写清什么？","opts":["起点和查找对象","吉凶结论","人物性格"],"a":0,"why":"起点不清楚，就容易把口诀查错。"},{"q":"尚未核实的内容应怎样处理？","opts":["直接当成规则","先保留疑问、核对课程资料"],"a":1,"why":"存疑内容需要核实，不应静默补成确定结论。"}],"lab":"stems"}], SOURCES=["# 易经学习项目：讲稿内容总结\n\n> 来源：《讲稿：易学讲座-实战篇（上）2018年3月》，共 86 页。\n>\n> 补充来源：施老师《易经》第二节课学习资料（2026年9月2日）。标记为“【待核内容】”的部分仍需进一步核实。\n>\n> 阅读提醒：本讲稿主要呈现传统易学、八字与命理术数体系。文中关于健康、婚姻、财富、灾祸、职业选择等内容属于讲者的传统术数观点，不能替代医疗、法律、财务、心理或其他专业判断。讲稿对部分内容使用了“科学”表述，但没有提供可核验的研究方法、数据或参考文献，因此不应直接视为现代科学结论。\n\n## 一、讲稿的总体主线\n\n讲稿以“一命、二运、三风水、四勤奋、五积德”为开场框架，主要讨论三个问题：\n\n1. 什么是“命”，怎样理解“好命”。\n2. 什么是“运”，怎样理解“好运”。\n3. 如何利用易学中的八字、五行、大运、神煞与口诀解释个人经历，并尝试“趋吉避凶”。\n\n全篇内容可以归纳为以下路径：\n\n```text\n《易经》概览\n    ↓\n出生时间转为八字（四柱）\n    ↓\n识别天干、地支、阴阳与五行\n    ↓\n分析五行旺衰、用神、喜神、忌神\n    ↓\n结合大运、流年及四柱关系\n    ↓\n查找神煞与口诀\n    ↓\n解释财富、健康、婚姻、事业等主题\n```\n\n## 二、《易经》的基本介绍（第 4-11 页）\n\n### 1. 形成与构成\n\n讲稿沿用传统叙述，将《周易》的形成概括为：\n\n- 伏羲画八卦，提出阴阳的基本框架。\n- 周文王、周公形成六十四卦及相关卦爻辞。\n- 孔子及后世学者形成《易传》，也称“十翼”。\n\n讲稿将《周易》分为两部分：\n\n- **《易经》经文**：六十四卦卦画、卦名、卦辞和爻辞。\n- **《易传》**：《彖》《象》《文言》《系辞》《说卦》《序卦》《杂卦》等内容。\n\n### 2. 讲稿对《易经》的定位\n\n讲稿将《周易》同时视为卜筮书、哲学书、历史书和传统经典，并强调其思想核心与“变化”“阴阳”有关。随后列举历代人物及中外学者与《易经》的联系，用来说明《易经》的历史影响力。\n\n需要注意，讲稿将二进制、粒子物理、遗传密码等现代科学内容与《易经》联系起来，但这些页面没有给出完整论证或可靠出处，学习时适合作为讲者观点记录，不宜直接当作科学史事实。\n\n## 三、八字与四柱（第 12-21、38-43 页）\n\n### 1. 八字是什么\n\n讲稿把一个人的出生年、月、日、时，按照干支历法转换成四组“天干 + 地支”：\n\n| 四柱 | 组成 | 讲稿中的象征 |\n|---|---|---|\n| 年柱 | 年干 + 年支 | 根、祖上、领导或大贵人 |\n| 月柱 | 月干 + 月支 | 枝、父母、兄妹、事业等 |\n| 日柱 | 日干 + 日支 | 花、自己、爱人、至亲等 |\n| 时柱 | 时干 + 时支 | 果、子辈、下属等 |\n\n四柱一共八个字，所以称为“八字”。男性命例称“乾造”，女性命例称“坤造”。\n\n讲稿特别强调以**日柱天干**作为分析出发点，这个字通常称为“日元”或“日主”。\n\n### 2. 时柱与出生时辰\n\n第 15 页列出“日上起时表”，把一天分成十二个时辰，每个时辰约两个小时。确定时支后，再根据日干推算对应的时干。\n\n### 3. 纳音与命的分类\n\n讲稿列出六十甲子纳音歌，将干支组合归入金、木、水、火、土等纳音类别，并用于解释人与人之间的生克关系、楼层选择等。\n\n这属于传统命理分类。仅依据出生年份或纳音判断合作、婚姻或居住选择，缺乏充分的现实决策依据。\n\n### 4. 天干与地支\n\n十天干及阴阳：\n\n- 阳干：甲、丙、戊、庚、壬。\n- 阴干：乙、丁、己、辛、癸。\n\n十二地支及生肖：\n\n| 地支 | 子 | 丑 | 寅 | 卯 | 辰 | 巳 | 午 | 未 | 申 | 酉 | 戌 | 亥 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| 生肖 | 鼠 | 牛 | 虎 | 兔 | 龙 | 蛇 | 马 | 羊 | 猴 | 鸡 | 狗 | 猪 |\n\n### 5. 四柱之间的关系\n\n第 41 页集中列出地支之间的：\n\n- 三合\n- 六合\n- 六冲\n- 三刑\n- 六害\n- 六破\n\n讲稿提醒，分析两个人或人与流年的关系不能只看生肖，还要结合月、日、时等其他柱位。\n\n## 四、五行体系（第 22-26、44-65、71-75 页）\n\n### 1. 五行生克\n\n讲稿以金、木、水、火、土作为分析八字的重要分类，并强调“平衡”。\n\n```text\n相生：木 → 火 → 土 → 金 → 水 → 木\n相克：木 → 土 → 水 → 火 → 金 → 木\n```\n\n讲稿尝试用燃烧、氧化、吸收等自然现象类比五行生克。学习时可以用这些例子帮助记忆，但这些类比不等于对五行理论的科学验证。\n\n### 2. 五行与方位、季节\n\n讲稿给出的主要对应关系如下：\n\n| 五行 | 天干 | 地支示例 | 方位 | 旺盛季节 |\n|---|---|---|---|---|\n| 木 | 甲、乙 | 寅、卯 | 东方 | 春季 |\n| 火 | 丙、丁 | 巳、午 | 南方 | 夏季 |\n| 土 | 戊、己 | 辰、戌、丑、未 | 中央 | 讲稿中与夏季一并展示 |\n| 金 | 庚、辛 | 申、酉 | 西方 | 秋季 |\n| 水 | 壬、癸 | 亥、子 | 北方 | 冬季 |\n\n### 3. 五行与性格、健康、行业及颜色\n\n讲稿进一步把五行对应到：\n\n- 性格特征\n- 身体器官及健康风险\n- 适合的职业和行业\n- 吉祥或忌讳颜色\n- 楼层、数字和方向\n\n例如，讲稿把金、水、木、火、土分别关联到肺肠、肾与泌尿系统、肝胆、心与循环系统、脾胃等；又把五行与金融、航运、教育、通信、房地产等行业联系起来。\n\n这些属于传统象征性对应，不能用于诊断疾病，也不宜作为选择专业、职业、投资或房产的唯一依据。\n\n## 五、用神、喜神、忌神与闲神（第 23-25、57-65 页）\n\n讲稿认为，八字分析的核心是判断五行旺衰，并寻找能调节整体平衡的元素：\n\n- **用神**：讲稿定义为本人必须或需要补充的五行。\n- **喜神**：能够生助用神、对本人有利的五行。\n- **忌神**：对本人形成克制或被视为不利的五行。\n- **闲神**：对整体影响不大的五行。\n\n讲稿把用喜神应用到职业、健康、年份吉凶、颜色及本命年穿着等主题。例如，它认为是否适合穿红色，应看“火”是用喜神还是忌神，而不能只依据是否处于本命年。\n\n从学习角度看，重要的是理解讲稿的分析顺序：\n\n```text\n找到日元 → 判断出生季节与五行旺衰 → 选择用神/喜神 → 再解释大运和流年\n```\n\n## 六、大运与流年（第 42-43、68-70 页）\n\n### 1. 基本概念\n\n讲稿将“命”理解为出生时形成的四柱结构，将“运”理解为人生不同阶段所进入的时间环境。\n\n- **大运**：通常以约十年为一个阶段排列。\n- **流年**：具体某一年的干支及其影响。\n\n### 2. 排运方向\n\n第 43 页用同一出生时间的男孩和女孩作比较，说明大运存在顺排与逆排的差别，并涉及性别、出生年阴阳、节气及起运年龄计算。\n\n这一部分信息密度较高。讲稿提供了示例，但不足以让初学者仅凭一页内容可靠完成独立排盘；更适合先识别大运表的结构：\n\n```text\n八字 → 大运干支 → 起运年龄 → 起始年份 → 对应流年\n```\n\n## 七、命例与传统断语（第 29-38、62、68-70、76 页）\n\n讲稿列出多种传统断语和命例，涉及：\n\n- 财富与所谓富贵格局\n- 婚姻与离婚倾向\n- 子女状况\n- 家庭关系\n- 健康或灾祸\n- 性格、事业及人生发展\n\n其中包括天干合化、“三奇格”、特定日柱、重复天干地支、柱与柱相冲等判断方式。随后通过若干匿名人物或公众人物命例，演示怎样把八字、五行、纳音、用喜神、神煞、大运和流年放在同一张分析表中。\n\n这些内容包含较强的确定性表述，但单凭四柱组合推断具体人生事件，容易产生过度概括和确认偏差。学习时可重点观察“命例表的组成”，不必直接接受每条断语的现实有效性。\n\n## 八、吉凶神煞（第 66-70、76-84 页）\n\n### 1. 神煞体系\n\n讲稿列出大量传统神煞名称，包括：\n\n- 天乙贵人、太极贵人、天德贵人、月德贵人\n- 三奇贵人、文昌贵人、国印贵人、福星贵人\n- 将星、驿马、华盖、桃花、禄神、天医\n- 亡神、劫煞、灾煞、孤辰寡宿、空亡\n- 阴阳差错、羊刃、天罗地网等\n\n讲稿用“好命、差命”来概括部分吉凶神煞组合，并把它们用于解释贵人、学业、迁移、感情、风险等主题。\n\n### 2. 口诀的查法\n\n第 77-84 页集中介绍多个“金口诀”。学习这些口诀时，应同时记录三个要素：\n\n| 口诀 | 主要起点 | 查找内容 | 讲稿中的用途 |\n|---|---|---|---|\n| 文昌 | 日干为主，年干为辅 | 对应地支位置 | 学业、书桌或办公位置 |\n| 天乙贵人 | 年干、月干或日干 | 对应地支 | 贵人关系 |\n| 将星 | 年支或日支 | 四柱其他地支 | 领导力或将星 |\n| 桃花 | 年支或日支 | 四柱其他地支 | 感情、桃花 |\n| 灾煞 | 年支或日支 | 四柱其他地支或流年 | 风险判断 |\n| 亡神 | 以日支为主 | 四柱其他地支或流年 | 较严重风险判断 |\n| 天罗地网 | 命局及辰、巳、戌、亥等组合 | 四柱、大运或流年 | 传统灾祸判断 |\n| 驿马 | 年支或日支 | 四柱其他地支或流年 | 出行、迁移、留学等 |\n\n口诀的重点不是只背文字，而是掌握“以什么为起点、到哪里查、结果怎样解释”。\n\n## 九、讲稿最终想表达什么（第 38、85-86 页）\n\n讲稿的核心立场是：\n\n1. 出生时间被认为包含一个人一生的吉凶信息。\n2. 好运到来时应抓住机会，所谓凶运到来时应提前预防。\n3. 易学的价值不仅在预测，也在于根据其传统体系进行调整或“化解”。\n4. 最终关注的问题包括财富、健康、合作、亲人流年及子女学业事业。\n\n讲稿以“了解命运、抓住机遇、益化人生”为总目标，并强调“重在化解”。\n\n## 十、全篇核心术语速查\n\n| 术语 | 简要含义 |\n|---|---|\n| 八字 | 出生年、月、日、时对应的四组干支，共八个字 |\n| 四柱 | 年柱、月柱、日柱、时柱 |\n| 日元/日主 | 日柱的天干，讲稿分析的重要出发点 |\n| 乾造/坤造 | 男性/女性的八字命例称呼 |\n| 纳音 | 六十甲子对应的传统五行分类 |\n| 五行 | 金、木、水、火、土 |\n| 用神 | 讲稿认为命局需要的五行 |\n| 喜神 | 能生助用神的五行 |\n| 忌神 | 讲稿认为会造成不利影响的五行 |\n| 大运 | 人生阶段性的运势周期，常以十年为一段 |\n| 流年 | 某个具体年份的干支及其影响 |\n| 神煞 | 根据干支组合查出的传统吉凶符号 |\n| 合、冲、刑、害、破 | 地支之间的多种传统关系分类 |\n\n## 十一、建议的学习重点\n\n如果只做一次入门学习，建议按以下优先级：\n\n1. 先理解八字、四柱和日元。\n2. 熟记十天干、十二地支与生肖。\n3. 熟记五行相生与相克。\n4. 看懂完整命例表由哪些部分组成。\n5. 理解大运、流年的基本结构。\n6. 最后再学习神煞与口诀的查法。\n\n不建议一开始就背诵大量断语。先掌握结构和查表方法，更容易形成清晰的知识体系。\n\n## 十二、一句话总结\n\n这份讲稿是一套以出生时间和干支五行为基础、结合大运流年与神煞口诀解释人生主题的传统易学入门材料；学习价值主要在于理解其文化术语和内部分析框架，而对健康、财富、婚姻及灾祸的现实判断应保持审慎，并由可靠证据和专业意见主导。\n\n## 十三、施老师第二节课课程补充\n\n### 1. 本节课的核心目标\n\n这节课程把重点放在“先记住基本语言，再进入排盘和案例”。施老师反复强调：十天干和十二地支必须达到能够按顺序默写、看到字就能联想到五行与阴阳的程度。\n\n课程给出的学习路径可以整理为：\n\n```text\n背熟十天干、十二地支\n    ↓\n建立天干的五行、阴阳与形象记忆\n    ↓\n读取软件排出的四柱\n    ↓\n定位日柱和日元\n    ↓\n清点八个字中的五行\n    ↓\n结合出生月份、地支关系和大运流年\n    ↓\n通过案例反复练习\n```\n\n### 2. 十天干的形象记忆法\n\n下表是施老师为了帮助记忆而使用的自然物象类比。它属于传统命理教学中的记忆工具，不是对人物性格或现实事件的科学证明。\n\n| 天干 | 五行与阴阳 | 课程中的记忆形象 |\n|---|---|---|\n| 甲 | 阳木 | 参天大树、大木 |\n| 乙 | 阴木 | 花草、藤蔓、草皮 |\n| 丙 | 阳火 | 太阳、强光与温暖 |\n| 丁 | 阴火 | 小火、灯火或细小热源 |\n| 戊 | 阳土 | 高山、厚重之土 |\n| 己 | 阴土 | 田园、可耕种之土 |\n| 庚 | 阳金 | 未精细加工的金属、毛坯金 |\n| 辛 | 阴金 | 首饰、手表、刀具等精细加工金属 |\n| 壬 | 阳水 | 大海、江河、大水 |\n| 癸 | 阴水 | 雨滴、细雨、小水 |\n\n可把十天干按五组记忆：\n\n```text\n甲乙属木｜丙丁属火｜戊己属土｜庚辛属金｜壬癸属水\n前者为阳｜后者为阴\n```\n\n### 3. 十二地支与六冲\n\n课程用“前六支与后六支相对”的方式帮助记忆六冲：\n\n| 六冲 | 生肖记忆 |\n|---|---|\n| 子午冲 | 鼠与马 |\n| 丑未冲 | 牛与羊 |\n| 寅申冲 | 虎与猴 |\n| 卯酉冲 | 兔与鸡 |\n| 辰戌冲 | 龙与狗 |\n| 巳亥冲 | 蛇与猪 |\n\n记忆方法：先写出 `子丑寅卯辰巳`，再在下面对应写出 `午未申酉戌亥`。学习时先做到准确识别关系，不急于把“冲”直接解释成现实中的坏事。\n\n### 4. 四柱的“根、枝、花、果”记忆\n\n课程再次使用树木结构帮助定位四柱：\n\n- 年柱为“根”，讲稿关联祖辈、早年环境等主题。\n- 月柱为“枝”，讲稿关联父母、事业等主题。\n- 日柱为“花”，其中日干是日元，讲稿关联本人；日支常被用于讨论伴侣。\n- 时柱为“果”，讲稿关联子女、下属或后期成果。\n\n这套类比的学习价值在于帮助定位栏目；其人物关系解释属于传统命理框架。\n\n### 5. 从排盘到分析的实战顺序\n\n施老师建议先用排盘软件得到四柱，但不要完全依赖软件列出的神煞。初学阶段可以采用以下检查表：\n\n1. 核对出生年、月、日、时及四柱结果。\n2. 找到日柱，并圈出日柱天干作为日元。\n3. 把八个字逐一归入金、木、水、火、土。\n4. 查看日元出生的月份和季节。\n5. 明确正在比较的是原命局、大运还是某个流年。\n6. 查地支的合、冲、刑、害、破等关系。\n7. 神煞或口诀必须写清“起点、查找对象、结果、解释”。\n8. 用多个案例重复练习，并记录无法确认的部分。\n\n### 6. 课程案例应怎样阅读\n\n课程中以“壬水生于不同月份”“辛金遇丁火”“丙午流年”等例子说明季节、五行和流年的组合思路。这些例子可以用于学习传统体系内部的推理顺序，但不应把其中关于性格、健康、父母寿命、财富、婚姻或具体事件的判断视为已经证实的事实。\n\n尤其需要区分三种内容：\n\n- **可以直接学习的术语与顺序**：十天干、十二地支、阴阳、五行、四柱、日元和六冲。\n- **老师的记忆类比**：大树与花草、太阳与灯火、高山与田园、毛坯与首饰、大海与细雨。\n- **传统命理判断**：关于人物性格、健康、家人、财富和流年的具体解释；这类内容需要明确标注为讲者观点。\n\n### 7. 合并后的学习重点\n\n在原来的 3 小时计划中，可把本节课程内容放入“单元 2：十天干与十二地支”：\n\n- 用 8 分钟练习十天干的五组物象。\n- 用 5 分钟默写阴阳天干。\n- 用 7 分钟画出六组地支相冲。\n- 最后闭卷复述“排盘 → 日元 → 五行 → 月份 → 关系 → 大运流年”的顺序。","施老师第二节课 · 基础学习摘录\n\n编辑说明：按知识点摘录已有课程资料，省略个人家庭、婚姻和具体命盘案例。本摘录按学习主题选编。\n\n一、必须熟记天干地支\n天干必须要记住，那么十个天干、十二个地支必须要记住。\n\n那么天干呢，就我现在就等于是【待核内容：把你作讲课的讲解】啊，反正我们是共学语言。天干就甲、乙、丙、丁、戊、己、庚、辛、壬、癸。那么甲乙就代表木头，那么就是甲乙；丙丁呢就代表火；戊己，戊己代表土；那么庚辛，庚辛代表金；壬癸代表水。\n\n二、十天干的五行和形象\n\n（一）甲木与乙木\n\n那么这个怎么记比较好记呢？我就教你一个方法。甲乙就代表什么呢？就是一个参天大树，一个树底下的就是那个花草、藤蔓、草皮，【待核内容：就是都是一点】，都是乙木。\n\n那么甲呢，就代表是大树的木头；那么乙呢，代表花花草草，都是木。\n\n（二）丙火与丁火\n\n甲乙丙丁，丙丁你就这样想，它属于火，属于亮光的。那么丙呢，就代表太阳；丁火呢，代表有一点点的火。\n\n（三）戊土与己土\n\n那么丙丁，戊己，戊也是土，己也为土。你首先想这个己土就是田园之土，田园之土，剩下来的都是己土了，就这样记就好记了，种庄稼的叫作己土。\n\n我们经常讲的一句话：“大地啊，母亲，你哺育了我。”就讲的是己土。\n\n（四）庚金与辛金\n\n那么戊己庚辛，庚辛，【待核内容：庚就是大方向，就是从大处上看去就是庚】。辛，辛苦的辛，辛就是小李飞刀，小的一点点的，用来雕花的，雕花，雕那个雕刻的刻刀上的这种东西。然后还有就是金戒指啊、手表啊，这种东西已经加工精细……\n\n你怎么分呢？一个是金属的毛坯，一个呢是金属已经加工成品了。凡是加工成品的，基本上都叫作辛金。但大刀也是加工成品的，这大部分就是我们是为了让你好记，才这样子说。其实只要凡是金属类的东西，你没有加工就是庚金，加工好以后的一般都叫辛金。辛金呢叫细软之金，就比较柔软的、就小的那种金，金戒指、金手表、金项链，然后包括我们用的不锈钢的这个水龙头，只要金属的，反正看到就是已经加工过的，小的螺丝、螺帽，都是辛金。那么庚金呢，就代表是毛坯金。\n\n（五）壬水与癸水\n\n那么这个呢，现在我这样讲，戊己庚辛，壬癸，一个是大海啊、江河，一个是下雨的小雨呀，哗啦唰啦一点，哗啦啦啦，这个就是水的区分。\n\n五、天干地支的阴阳属性\n那么十二个地支呢，一定要背得准的。这个呢，叫子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥，这个就要背得滚瓜烂熟。\n\n那么你知道第一个老鼠，老鼠它是属于阳的。那么刚刚我们讲的那个天干，天干也是属于阴阳的。甲木是阳，乙木是阴；丙火是阳，太阳是阳，丁火是阴；戊土，你就想想那个戊土，就是高山，它是阳的；田园之土是阴。那么就是庚金属于阳，辛金属于阴；然后壬水是大海，属于阳；就是癸水属于阴。\n\n七、十二地支与六冲\n那么十二个地支呢，也是分阴阳。老鼠反正是阳。\n\n你记住老鼠，你后面其实就记住个马就可以了。为什么？老鼠跟马是六冲的。就是子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥。你就背前六个，你就背这个子、丑、寅、卯、辰、巳，背六个生肖就知道了。因为后面是午、未、申、酉、戌、亥，跟前面这六个生肖正好是冲。\n\n子冲的是马，午；丑冲的是羊，牛冲的羊；然后老虎冲的是猴子；然后兔子冲的是鸡；然后龙冲的是狗；然后蛇冲的，最后是六个生肖的最后一个，是猪。\n\n所以子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥。然后同时子丑寅卯，子丑寅……子、丑、寅、卯、辰、巳，这六个生肖；然后后面是午、未、申、酉、戌、亥。前面六个跟后面六个正好是冲。\n\n这个可能慢慢后面会体会。要是现场嘛，我就跟你看，就怎么讲。\n\n八、读盘的基础步骤（学习整理，非逐字原话）\n四柱先看年、月、日、时。老师用“根、枝、花、果”帮助记忆。日柱天干是日元。\n\n（四）从八个字清点五行\n就是年、月、日、时。因为为什么要让你记住这个十个天干、十二个地支？是为了要看这个八个字。\n\n八个字看会了，然后呢，你分得清楚，它八个字里边多少金、木、水、火、土，有几个金、几个木、几个水，就能点清楚。\n\n点清楚以后呢，主要是看你的日元。日元就是你，是壬，壬水生在几月份。\n\n（五）不同月份的壬水需要不同五行\n然后这个到时候以后，我还会教你有一个表格，教你就是它不同的月份，正月、二月、三月、四月、五月，到十二月的壬水，它需要的东西都不一样的。\n\n你要到五六月，五月、六月，你就不能碰土了，土一点都不能要了。要什么东西啊？那个水都快干掉了，它要的什么啊？要庚金、辛金，就是在生我呀，“妈妈快点来帮帮我”。\n\n那么庚金、辛金，还要什么呀？这个水不够啊。【待核内容：你这个海水放在那个海水里边，这个大河，放在那个南水北调啊】，我就是从这里的大水再调调，调点给我。所以我们说：“大河有水小河满，大河无水小河干。”\n\n就是大的有水。就像我们那个到湖里钓鱼一样，这湖怎么开始没水了嘛？是政府在放水，把它水放掉了，它可能放给更需要的人去了。\n\n所以二月的冷水、夏天的壬水，也是不一样，跟秋天的壬水也是不一样。\n\n九、通过案例积累经验（摘录）\n先把十个天干、十二个地支，然后它们在排盘里代表什么意思、它们的性格代表什么意思，先去了解。了解了以后，然后我们再来用实际案例来讲。\n","第二节课 · 八（二）· 二月壬水的学习摘录\n\n你想象现在农历二月份的水，大地刚刚回春，春寒料峭。那个时候怎么回事啊？这个水啊，实际上还不够，就冻在那里，不是很够。\n\n那么这个时候要什么呀？要庚金来生你，那还要什么呀？要阳光最好照着你，对吧？那如果水太……等到冰融化了以后，那个水要扑出来怎么办？最好有戊土来帮忙把你挡住。\n\n所以你要这个东西，就是你要补的是庚金啊，然后丙火啊，然后要有点戊土挡啊，或者甲木来辅助啊。这个就每个年份的含义就不一样。"];

function exportData(){let b=new Blob([JSON.stringify({app:'zhiyi',version:1,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='知易-学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(d.app!=='zhiyi'||d.version!==1||!d.state)throw Error();let s=d.state;if(!Array.isArray(s.done)||!Array.isArray(s.wrong)||!Array.isArray(s.days)||typeof s.notes!=='object'||!s.notes||typeof s.answers!=='object'||!s.answers)throw Error();if(!s.done.every(i=>Number.isInteger(i)&&i>=0&&i<12)||!Object.entries(s.notes).every(([k,v])=>/^\d+$/.test(k)&&+k<12&&typeof v==='string')||!s.wrong.every(k=>/^([0-9]|1[01])-[01]$/.test(k))||!Object.entries(s.answers).every(([k,v])=>/^([0-9]|1[01])-[01]$/.test(k)&&Number.isInteger(v)&&v>=0&&v<LESSONS[k.split('-')[0]].qs[k.split('-')[1]].opts.length)||!s.days.every(x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)))throw Error();state.academy=mergeAcademy(state.academy,s.academy);state.done=[...new Set([...state.done,...s.done])];state.answers={...s.answers,...state.answers};state.notes={...s.notes,...Object.fromEntries(Object.entries(state.notes).filter(([k,v])=>v))};state.days=[...new Set([...state.days,...s.days])];state.wrong=[...new Set([...s.wrong,...state.wrong])].filter(k=>state.answers[k]!==LESSONS[k.split('-')[0]].qs[k.split('-')[1]].a);if(s.method&&Array.isArray(s.method.done)&&s.method.inputs&&typeof s.method.inputs==='object'){let mi=Object.fromEntries(Object.entries(s.method.inputs).filter(([k,v])=>/^[a-zA-Z0-9]+$/.test(k)&&typeof v==='string'));state.method.inputs={...mi,...Object.fromEntries(Object.entries(state.method.inputs).filter(([k,v])=>v))};state.method.done=[...new Set([...state.method.done,...s.method.done.filter(n=>Number.isInteger(n)&&n>=0&&n<8)])];}save();renderNotes();toast('记录已合并，现有笔记优先保留')}catch(e){toast('无法读取：请选择“知易”导出的有效学习记录。')}}
function renderSources(){$('#view').innerHTML=`<div class="eyebrow">施老师课程 · 学习摘录</div><h1>有出处，学得更踏实。</h1><p class="muted">依据施老师课程整理的学习摘录。讲稿页码沿用总结中的标注；文昌诀第77页已对照原页核实，可在「施老师教法」第7步查看。</p><div class="note">本版包含 12 节入门短课。风水先覆盖五行方位；住宅布局、完整起运与神煞计算，等待更完整原课资料后再扩展。</div><label for="sourceSearch" class="small">搜索课程原文或课程标题</label><input id="sourceSearch" type="search" placeholder="搜索“日元”“文昌”“甲木”……" oninput="searchSources(this.value)"><div id="searchResults" class="search-results" style="margin-top:18px"></div><div class="chips"><button class="chip ${sourceIndex===0?'active':''}" onclick="sourceIndex=0;renderSources()">讲稿内容总结</button><button class="chip ${sourceIndex===1?'active':''}" onclick="sourceIndex=1;renderSources()">第二节课学习摘录</button></div><p class="small muted">${sourceIndex===0?'来源：《易学讲座·实战篇（上）》86页讲稿的既有总结，含第二节课补充。':'来源：施老师第二节课学习摘录，已省略个人案例。存疑内容不作为计算依据。'}</p><div class="source-text" id="sourceText"></div>`;$('#sourceText').textContent=SOURCES[sourceIndex]}
function searchSources(term){let t=term.trim(),out=[];if(!t){$('#searchResults').innerHTML='';return}LESSONS.forEach((l,i)=>{if((l.title+l.lead+l.parts.flat().join('')).includes(t))out.push(`<button class="card" onclick="openLesson(${i})">课程 ${i+1} · ${l.title} →</button>`)});SOURCES.forEach((s,i)=>{let pos=0,count=0;while((pos=s.indexOf(t,pos))!==-1&&count<8){let a=Math.max(0,pos-45),b=Math.min(s.length,pos+t.length+85);out.push(`<div class="card small"><b>${i?'第二节课':'讲稿总结'}</b><p style="margin:8px 0 0">…${esc(s.slice(a,b))}…</p></div>`);pos+=t.length;count++}});$('#searchResults').innerHTML=out.length?out.join(''):'<p class="muted">没有找到这个词，试试更短的关键词。</p>'}

const methodTitles=['背熟干支','认四柱、找日元','清点八字五行','看月份、辨所需','分命局、大运、流年','查地支关系','按老师口诀起查','复述思路、再练案例'];
state.method=state.method&&Array.isArray(state.method.done)&&state.method.inputs?state.method:{done:[],inputs:{},step:0};
function methodSet(k,v){state.method.inputs[k]=v;state.method.done=state.method.done.filter(x=>x!==state.method.step);save();let next=$('#methodNext');if(next)next.disabled=true;let f=$('#methodFeedback');if(f)f.innerHTML='<span class="small muted">答案已更新，请重新核对。</span>';let progress=$('#methodProgress');if(progress)progress.textContent='已练会 '+state.method.done.length+' / 8 步'}
function mInput(k,ph=''){return `<input class="method-input" id="m-${k}" value="${esc(state.method.inputs[k]||'')}" placeholder="${ph}" oninput="methodSet('${k}',this.value)">`}
function mSelect(k,opts){return `<select class="method-input" id="m-${k}" onchange="methodSet('${k}',this.value)"><option value="">请选择</option>${opts.map(o=>`<option value="${esc(o)}" ${state.method.inputs[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function mField(label,control){return `<label class="method-field"><span>${label}</span>${control}</label>`}
function methodStep(n){state.method.step=n;save();renderMethod();window.scrollTo(0,0)}

if(n===0)body=methodProof('天干必须要记住，那么十个天干、十二个地支必须要记住。','第二节课 · 一')+`<p>先自己默写，核对后再回忆五组物象：大树与花草、太阳与小火、高山与田园、毛坯与精细金属、大海与细雨。</p>${mField('按顺序默写十天干',mInput('stems','从甲开始，标点和空格不影响核对'))}${mField('按顺序默写十二地支',mInput('branches','从子开始'))}<details><summary>记不起来？展开老师的记忆表</summary><p>甲乙木 · 丙丁火 · 戊己土 · 庚辛金 · 壬癸水<br>每组前阳后阴。<br>子丑寅卯辰巳 · 午未申酉戌亥</p></details>`;
if(n===1)body=methodProof('所以我们叫“根、枝、花、果”：年份代表根，月份代表就是一个树的枝子，然后日子代表这个树上的一朵花，然后时辰代表果实的果。','第二节课 · 八（一）')+`<p>本练习固定使用下面的教学组合，只练读图顺序，不对应个人出生时间。</p>${methodChart()}<div class="grid practice-grid">${['年柱','月柱','日柱','时柱'].map((t,i)=>mField(t+'对应',mSelect('root'+i,['根','枝','花','果']))).join('')}</div>${mField('日元是哪一个字？',mSelect('day',stems))}`;
if(n===2)body=methodProof('你分得清楚，它八个字里边多少金、木、水、火、土，有几个金、几个木、几个水，就能点清楚。','第二节课 · 八（四）')+`<p>沿用上一张教学组合。逐字分类后，再核对数量；此处只按八个表面干支的基本五行归类，不展开藏干。</p><div class="grid practice-grid">${['甲','子','丙','寅','壬','午','庚','子'].map((t,i)=>mField(['年干','年支','月干','月支','日干','日支','时干','时支'][i]+' · '+t,mSelect('el'+i,els))).join('')}</div>`;
if(n===3)body=methodProof('它不同的月份，正月、二月、三月、四月、五月，到十二月的壬水，它需要的东西都不一样的。','第二节课 · 八（五）')+`<p>回到老师的壬水课程案例。以下是老师在这两个情境里的传统分析思路，月份沿用他的课程称呼，不在这里换算节气月。</p><div class="grid practice-grid"><div class="card"><h3>课程情境 A · 农历二月</h3><p>老师用春寒、水尚冷的画面解释：谈到庚金来生、丙火照暖；又在“水太多”的条件下谈到戊土挡、甲木辅助。</p></div><div class="card"><h3>课程情境 B · 五六月</h3><p>老师用“水都快干掉了”的画面解释：谈到庚辛来生、水来补充，并说这个情境下不能再要土。</p></div></div>${mField('为什么两次谈到“土”时说法不同？',mSelect('season',['因为只要壬水就必须补土','月份和所处情境不同，所需也不同','五行中数量最少的永远最好']))}<div class="small muted">依据：第二节课 · 八（二）、八（五）。老师提到后续会教十二月份的表；现有资料没有完整表，本练习仅比较这两个课程情境。</div>`;
if(n===4)body=`<div class="note">课程依据：讲稿总结 §六；第二节课 §九（一）。先知道正在读哪张表，再把关系放进去。</div>${mField('出生年、月、日、时组成的基础表',mSelect('time0',['命局','大运','流年']))}${mField('通常约十年一个阶段',mSelect('time1',['命局','大运','流年']))}${mField('某一个具体年份的干支',mSelect('time2',['命局','大运','流年']))}<p class="small muted">本步练概念。起运年龄与顺逆排，仍需按明确的历法口径另行核对。</p>`;
if(n===5)body=methodProof('前面六个跟后面六个正好是冲。','第二节课 · 七')+`<p>先照老师的方法分成两排，再逐组连起来。学会的是“哪两个支相冲”，不是仅凭一个冲字下结论。</p><div class="grid practice-grid">${branches.slice(0,6).map((t,i)=>mField(t+'与谁相冲？',mSelect('pair'+i,branches.slice(6)))).join('')}</div>`;
if(n===6)body=`<div class="note"><div class="small muted">施老师讲义第 77 页 · 文昌诀 · 已对照原页</div>“此诀：以日元为主，年干为辅”</div><p>这次只练文昌诀。先选起查依据，再从老师的表中找目标支，并在练习盘里定位；每一个结果都保留查法。</p>${methodChart()}<div class="grid practice-grid">${mField('起查依据',mSelect('wenStart',['日元为主','年干为辅']))}${mField('起查天干',mSelect('wenStem',stems))}${mField('查得目标地支',mSelect('wenTarget',branches))}</div><details><summary>展开老师的文昌口诀与原页</summary><h3>金口诀：文昌诀</h3><p>孩子书桌、当官办公桌的重要位置！</p><p>甲乙巳午报君知<br>丙戊申宫丁己鸡<br>庚猪辛鼠壬逢虎<br>癸见卯来文昌齐</p><p class="small">原页释文：甲在巳位，乙在午位；丙戊在申位，丁己在鸡位；庚在亥位，辛在鼠位；壬在虎位，癸在卯位。此诀：以日元为主，年干为辅。<br>地支对照：甲→巳、乙→午、丙戊→申、丁己→酉、庚→亥、辛→子、壬→寅、癸→卯。</p><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAeAB4AAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wgARCAOEBLADASIAAhEBAxEB/8QAHAABAAMBAQEBAQAAAAAAAAAAAAUGBwQDAgEI/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEAMQAAAB388z0RQlUUJVFCVRQlUUJVFehIgFfLAq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq4tCri0KuLQq8wSADyjyVRQlUUJVFCVRQlUUJVGSYiZaLOX7l/QhE2IRNiETYhE2ISCvFWLR+h84zsmbE4uIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKcuIpy4inLiKbW9Wy41EFY6vyTI9NiETYhE2IRNiETYo14rNmP2LlIskIuUrx4LX+lT/LaKktvmVC55zKFyqsdyGjOXqOClSvWWSJlqsfK1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CqrUKqtQqq1CpW2F7Tuy7UcsNTfg4+D0phpcRV/wkv33spU/wBtgqa2CnXCtWQrVmrNmP2LlIskK9Ya8WT9/P0fPnTjp/bL0HJ8d3AVO61C6lY47n+GS6xQbcSdUs9cLOAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADxr9mqpas50alnR4yVgIeW+hm2j57ohCQ9zEJNwPMWcFZs  for(const [id,p] of Object.entries(raw.reviews||{})){if(!questionById(id)||!p||typeof p!=='object'||!Number.isInteger(p.attempts)||p.attempts<1||!Number.isInteger(p.correct)||p.correct<0||p.correct>p.attempts||![0,1,2,3].includes(p.stage)||!/^\d{4}-\d{2}-\d{2}$/.test(p.due))continue;clean.reviews[id]={attempts:p.attempts,correct:p.correct,stage:p.stage,due:p.due,lastSuccessDay:typeof p.lastSuccessDay==='string'?p.lastSuccessDay:'',updatedAt:Number.isFinite(p.updatedAt)?p.updatedAt:0}}
 clean.bookmarks=Array.isArray(raw.bookmarks)?raw.bookmarks.filter(x=>FAQ.some(q=>q.id===x)):[];clean.pending=Array.isArray(raw.pending)?raw.pending.filter(x=>typeof x==='string'&&x.trim()).slice(0,100):[];return clean;
}
function mergeAcademy(current,incoming){const a=safeAcademy(current),b=safeAcademy(incoming);if(!Object.keys(a.cases).length)a.lastCase=b.lastCase;for(const group of ['cases','reviews'])for(const [id,v] of Object.entries(b[group]))if(!a[group][id]||v.updatedAt>a[group][id].updatedAt)a[group][id]=v;if((b.compare.updatedAt||0)>(a.compare.updatedAt||0))a.compare=b.compare;a.bookmarks=[...new Set([...a.bookmarks,...b.bookmarks])];a.pending=[...new Set([...a.pending,...b.pending])].slice(0,100);return a}

function findFAQ(query){const t=query.trim();if(!t)return FAQ;if(/发财|赚多少钱|寿命|诊断|一定离婚|一定.*好运|预测.*运/.test(t))return [];return FAQ.map(q=>({item:q,score:q.keys.reduce((n,k)=>n+(t.includes(k)?k.length:0),0)+(q.q===t?30:0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.item)}

function evidenceButton(id){return `<button class="source-button" onclick="openEvidence('${id}')">${EVIDENCE[id].kind} · ${EVIDENCE[id].location} ↗</button>`}
function teachingChart(c){return `<div class="pillars">${c.pillars.map((p,i)=>`<div class="pillar case-pillar"><small>${['年柱','月柱','日柱','时柱'][i]}</small><div>${p[0]}<br>${p[1]}</div></div>`).join('')}</div><p class="small muted centered">教学组合 · 不对应个人出生时间 · 不作独立排盘结果</p>`}
function caseState(c){return state.academy.cases[c.id]??(state.academy.cases[c.id]={step:0,answers:{},note:'',updatedAt:Date.now()})}
function selectCase(id){activeCase=id;state.academy.lastCase=id;save();go('cases')}
function renderCases(){const c=CASES.find(x=>x.id===activeCase)||CASES[0],s=caseState(c),qs=caseQuestions(c);const firstMissing=qs.findIndex((q,i)=>s.answers[i]?.choice!==q.correct);if(s.step>(firstMissing<0?5:firstMissing))s.step=firstMissing;const step=s.step,q=qs[step],a=s.answers[step];$('#view').innerHTML=`<div class="eyebrow">案例教学 · 知易 1.0.1</div><h1>把一张四柱，读成一条思路。</h1><p class="muted">先作答，再看解析。每一步都能回看课程依据。</p><div class="chips">${CASES.map(x=>`<button class="chip ${x.id===c.id?'active':''}" onclick="selectCase('${x.id}')">${x.title}</button>`).join('')}</div><div class="case-layout"><section class="card case-sheet"><h3>${c.title}</h3><p class="small muted">${c.intro}</p>${teachingChart(c)}<div class="progress"><div style="width:${Math.min(step,5)*20}%"></div></div><p class="small muted">${Math.min(step,5)} / 5 步完成</p><ol class="case-path">${qs.map((x,i)=>`<li class="${i===step?'current':''}">${x.skill}${s.answers[i]?.choice===x.correct?' ✓':''}</li>`).join('')}</ol></section><section class="card case-work">${step<5?`<div class="eyebrow">STEP ${step+1} / 5</div><h2>${q.q}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-case-option="${i}" onclick="answerCase(${i})" ${a?.choice===q.correct?'disabled':''}>${'ABC'[i]}. ${o}</button>`).join('')}</div>${a?`<div class="feedback ${a.choice===q.correct?'':'wrong'}" role="status">${a.choice===q.correct?'判断正确。':'再看一下这个位置。'}${q.why}</div>`:'<p class="small muted">先给出你的判断，提交后再展开分析。</p>'}<div class="section">${evidenceButton(q.source)}</div><button id="caseNext" class="btn" style="margin-top:20px" onclick="caseNext()" ${a?.choice===q.correct?'':'disabled'}>${step===4?'完成并复述 →':'进入下一步 →'}</button>`:`<div class="eyebrow">一张盘，一条分析路径</div><h2>现在，用自己的话连起来。</h2><div class="case-recap">${qs.map((x,i)=>`<article><h3>${i+1}. ${x.skill}</h3><p>${x.why}</p><p class="small muted">作答顺序：${(s.answers[i]?.history||[x.correct]).map(n=>x.options[n]+(n===x.correct?' ✓':' ×')).join(' → ')}</p><span class="small muted">本步作答 ${s.answers[i]?.attempts||0} 次</span> · ${evidenceButton(x.source)}</article>`).join('')}</div><label for="caseNote">我的复述</label><textarea id="caseNote" placeholder="先找日元，再清点五行……" oninput="saveCaseNote(this.value)">${esc(s.note)}</textarea><p id="caseSaved" class="saved">自动保存在本机</p><div class="row"><button class="btn" onclick="selectCase('${c.id==='a'?'b':'a'}')">换一个案例练 →</button><button class="btn outline" onclick="go('compare')">看看月份对照 →</button></div>`}</section></div>`}
function answerCase(choice){const c=CASES.find(x=>x.id===activeCase),s=caseState(c),q=caseQuestions(c)[s.step];if(!q||s.answers[s.step]?.choice===q.correct)return;const prev=s.answers[s.step];if(prev?.choice===choice)return;s.answers[s.step]={choice,history:[...(prev?.history||[]),choice].slice(-50),attempts:(prev?.attempts||0)+1};s.updatedAt=Date.now();recordReview(`case:${c.id}-${s.step}`,choice===q.correct);renderCases()}
function caseNext(){const c=CASES.find(x=>x.id===activeCase),s=caseState(c),q=caseQuestions(c)[s.step];if(q&&s.answers[s.step]?.choice===q.correct){s.step++;s.updatedAt=Date.now();save();renderCases();window.scrollTo(0,0)}}
function saveCaseNote(value){const s=caseState(CASES.find(x=>x.id===activeCase));s.note=value;s.updatedAt=Date.now();$('#caseSaved').textContent=save()?'已保存 ✓':'未保存，请导出备份'}
function renderCompare(){const s=state.academy.compare,q=COMPARE_QUESTION,answered=Number.isInteger(s.choice);$('#view').innerHTML=`<div class="eyebrow">对照实验室 · 同一日元，不同条件</div><h1>同是壬水，月份改变了什么？</h1><p class="muted">沿用老师课中使用的“农历二月”和“五六月”称呼。这里比较讲解情境，不计算实际节气月。</p><div class="grid practice-grid"><div class="card"><span class="badge">课程情境 A</span><h2>农历二月 · 春寒</h2><p>想象大地刚回春，水尚冷。</p>${evidenceButton('spring')}</div><div class="card"><span class="badge">课程情境 B</span><h2>五六月 · 水少</h2><p>想象天气热，水都快干掉了。</p>${evidenceButton('seasons')}</div></div><section class="card section"><h2>${q.q}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-compare-option="${i}" onclick="answerCompare(${i})" ${s.choice===q.correct?'disabled':''}>${o}</button>`).join('')}</div>${answered?`<div class="feedback ${s.choice===q.correct?'':'wrong'}">${q.why}</div><div class="comparison-table"><table><caption>教学整理 · 条件与讨论一一对应</caption><thead><tr><th>比较点</th><th>二月情境</th><th>五六月情境</th></tr></thead><tbody><tr><th>情境</th><td>春寒，先谈水冷；水多时再谈约束</td><td>水少，需要生助与补充</td></tr><tr><th>老师谈到的所需</th><td>庚金生助、丙火照暖；水多时谈戊土挡、甲木辅助</td><td>庚辛生助、水来补充；该情境下不再要土</td></tr><tr><th>能否固定套用</th><td colspan="2">不能。先保留月份与条件，再理解结论；不是所有壬水共用一套补法。</td></tr></tbody></table></div><p class="small muted">上表依据课程八（二）、八（五）整理，非逐字原话。完整十二月用神表尚未收录。</p><label for="compareNote">我理解的“条件变化”</label><textarea id="compareNote" oninput="saveCompareNote(this.value)" placeholder="哪些条件变了？哪些不能直接推出？">${esc(s.note||'')}</textarea><p class="saved">自动保存到学习记录</p>`:'<p class="muted small">先选一个判断，再看完整对照。</p>'}</section>`}
function answerCompare(choice){if(state.academy.compare.choice===1||state.academy.compare.choice===choice)return;state.academy.compare={...state.academy.compare,choice,updatedAt:Date.now()};recordReview('compare:seasons',choice===1);renderCompare()}
function saveCompareNote(note){state.academy.compare={...state.academy.compare,note,updatedAt:Date.now()};save()}
function selectSound(c){activeSound=c;soundAnswered=null;speechGeneration++;window.speechSynthesis?.cancel();renderSound()}
function renderSound(){const q=soundQuestion(activeSound);$('#view').innerHTML=`<div class="eyebrow">零基础陪练 · 每个字都读得清楚</div><h1>听一遍，看清字，再选一次。</h1><p class="muted">系统中文语音辅助朗读，非施老师本人声音。拼音始终保留。</p><div class="chips">${SOUND_CHARS.map(c=>`<button class="chip ${c===activeSound?'active':''}" onclick="selectSound('${c}')">${c}</button>`).join('')}</div><div class="grid practice-grid"><section class="card centered"><div class="sound-glyph">${activeSound}</div><div class="row centered" style="justify-content:center"><button class="btn" id="speakChar" onclick="speakCharacter()">▶ 听这个字</button><button class="btn outline" onclick="stopSpeaking()">停止</button></div><p class="small muted" id="speechStatus" role="status">点击朗读；语音由当前浏览器提供。</p><p class="small">戊 · 戌 · 戍<br>己 · 巳 · 已</p></section><section class="card"><h2>${q.q}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-sound-option="${i}" onclick="answerSound(${i})" ${soundAnswered!==null?'disabled':''}>${o}</button>`).join('')}</div>${soundAnswered!==null?`<div class="feedback ${soundAnswered===q.correct?'':'wrong'}" role="status">${q.why}</div>`:''}<button class="btn outline" onclick="selectSound(SOUND_CHARS[(SOUND_CHARS.indexOf(activeSound)+1)%SOUND_CHARS.length])">下一字 →</button><div class="section">${evidenceButton('imagery')}<p class="small muted">字音参考词表中的普通话读音；已、戍是辨形补充，不属于干支。</p></div></section></div>`}
let speechGeneration=0;
function speechStatus(message){if($('#speechStatus'))$('#speechStatus').textContent=message}
function speakCharacter(){const api=window.speechSynthesis;if(!api||!window.SpeechSynthesisUtterance){speechStatus('此浏览器不支持朗读，请按拼音进行文字练习。');return}const voices=api.getVoices().filter(v=>/^zh(-|_)/i.test(v.lang));if(!voices.length){speechStatus('当前未找到中文语音。可稍后再试；拼音和辨字练习仍可使用。');return}api.cancel();const token=++speechGeneration,c=activeSound,u=new SpeechSynthesisUtterance((stems.includes(c)?'天干，':branches.includes(c)?'地支，':'辨形，')+c+'。');u.lang='zh-CN';u.voice=voices.find(v=>/^zh[-_]CN$/i.test(v.lang))||voices[0];u.rate=.75;u.onstart=()=>token===speechGeneration&&speechStatus('正在朗读：'+c);u.onend=()=>token===speechGeneration&&speechStatus('朗读结束，可以再听一遍。');u.onerror=()=>token===speechGeneration&&speechStatus('朗读暂时不可用，请继续看拼音练习。');speechStatus('准备朗读：'+c);api.speak(u)}
function stopSpeaking(){speechGeneration++;window.speechSynthesis?.cancel();speechStatus('已停止朗读。')}
function answerSound(choice){if(soundAnswered!==null)return;soundAnswered=choice;recordReview('sound:'+activeSound,choice===soundQuestion(activeSound).correct);renderSound()}
function reviewEntries(){return Object.entries(state.academy.reviews).filter(([id])=>questionById(id)).sort((a,b)=>a[1].due.localeCompare(b[1].due)||a[1].stage-b[1].stage)}
function renderToday(){const day=dayString(),all=reviewEntries(),due=all.filter(([,x])=>x.due<=day),future=all.filter(([,x])=>x.due>day);const weak={};all.forEach(([id,r])=>{const skill=questionById(id).skill;weak[skill]??={attempts:0,correct:0};weak[skill].attempts+=r.attempts;weak[skill].correct+=r.correct});$('#view').innerHTML=`<div class="eyebrow">今日复习 · 根据真实作答安排</div><h1>今天，补上最不熟的一步。</h1><p class="muted">错题当天重练；答对后按 1、3、7 天安排复习。这是 App 的记忆练习规则。</p><div class="stats"><div class="stat"><strong>${due.length}</strong><small>现在到期</small></div><div class="stat"><strong>${future.length}</strong><small>未来安排</small></div><div class="stat"><strong>${all.reduce((n,[,x])=>n+x.attempts,0)}</strong><small>累计有效作答</small></div></div>${reviewActive?reviewCard():''}<section class="section"><h2>现在到期</h2>${due.length?`<div class="grid practice-grid">${due.map(([id,r])=>`<button class="card" onclick="startReview('${id}')"><h3>${questionById(id).skill}</h3><p class="small">${questionById(id).q}</p><span class="small muted">${r.correct} / ${r.attempts} 次正确 · 开始复习 →</span></button>`).join('')}</div>`:'<div class="card"><p>现在没有到期题目。</p><button class="btn" onclick="go(\'cases\')">从第一个案例开始 →</button></div>'}</section><section class="section"><h2>我的薄弱点</h2><div class="grid practice-grid">${Object.entries(weak).sort((a,b)=>a[1].correct/a[1].attempts-b[1].correct/b[1].attempts).map(([name,v])=>`<div class="card"><h3>${name}</h3><p class="small">正确 ${v.correct} / ${v.attempts} 次</p><div class="progress"><div style="width:${100*v.correct/v.attempts}%"></div></div></div>`).join('')||'<p class="muted">完成一次案例或听读练习后，会生成你的练习记录。</p>'}</div></section><section class="section"><h2>未来安排</h2>${future.length?future.map(([id,r])=>`<p class="future-row"><span>${questionById(id).skill} · ${questionById(id).q}</span><b>${r.due}</b><button class="chip" onclick="startReview('${id}')">提前练习</button></p>`).join(''):'<p class="muted">答对后，这里会显示下一次复习日期。</p>'}</section>`}
function startReview(id){reviewActive=id;reviewAnswered=null;renderToday();$('#reviewCard')?.scrollIntoView({behavior:'smooth',block:'start'})}
function reviewCard(){const q=questionById(reviewActive);if(!q)return '';return `<section id="reviewCard" class="card section"><div class="row between"><h2>复习 · ${q.skill}</h2><button class="chip" onclick="reviewActive=null;renderToday()">收起</button></div><h3>${q.q}</h3><div class="options">${q.options.map((o,i)=>`<button class="option" data-review-option="${i}" onclick="answerReview(${i})" ${reviewAnswered!==null?'disabled':''}>${o}</button>`).join('')}</div>${reviewAnswered!==null?`<div class="feedback ${reviewAnswered===q.correct?'':'wrong'}">${q.why}<br>下次复习：${state.academy.reviews[reviewActive].due}</div>`:''}${evidenceButton(q.source)}</section>`}
function answerReview(choice){if(reviewAnswered!==null)return;reviewAnswered=choice;recordReview(reviewActive,choice===questionById(reviewActive).correct);renderToday()}
function renderAsk(){$('#view').innerHTML=`<div class="eyebrow">课程答疑 · ${FAQ.length} 条有出处的本地问答</div><h1>先问为什么，再回到课程里。</h1><p class="muted">这是按课程整理的问答库，不是实时生成式 AI。未收录的规则保留为待核问题。</p><label for="askQuery">想弄懂哪个概念？</label><input type="search" id="askQuery" placeholder="例如：日元怎么找？文昌查哪里？" value="${esc(faqQuery)}" oninput="faqQuery=this.value;renderFAQResults()"><div id="faqResults" class="section"></div><section class="section"><h2>我的待核问题</h2><div id="pendingQuestions">${state.academy.pending.length?state.academy.pending.map((q,i)=>`<div class="card pending-row"><span>${esc(q)}</span><button class="chip" onclick="removePending(${i})">已解决，移出</button></div>`).join(''):'<p class="muted">课程尚未覆盖的问题可以保存在这里，等补充材料后继续核对。</p>'}</div></section>`;renderFAQResults()}
function renderFAQResults(){const found=findFAQ(faqQuery);$('#faqResults').innerHTML=found.length?found.map(q=>`<article class="card faq-card"><div class="row between"><span class="badge">${q.status||'课程内解释 · 教学整理'}</span><button class="chip" onclick="toggleBookmark('${q.id}')">${state.academy.bookmarks.includes(q.id)?'已收藏 ✓':'收藏'}</button></div><h2>${q.q}</h2><p>${q.answer}</p>${evidenceButton(q.source)}</article>`).join(''):`<div class="card"><h2>现有问答未覆盖这个问题。</h2><p>先留下问题，等待对应课程证据；这里不会用无关口诀补成答案。</p><button class="btn" onclick="savePending()">保存到待核清单</button></div>`}
function toggleBookmark(id){const a=state.academy.bookmarks;state.academy.bookmarks=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();renderFAQResults()}
function savePending(){const q=faqQuery.trim();if(!q)return;if(!state.academy.pending.includes(q))state.academy.pending.push(q);save();renderAsk();toast('已保存待核问题。')}
function removePending(i){state.academy.pending.splice(i,1);save();renderAsk()}
function academyNotesHTML(){return `<div class="card section"><h3>案例复述与收藏</h3>${CASES.map(c=>state.academy.cases[c.id]?.note?`<h3>${c.title}</h3><p style="white-space:pre-wrap">${esc(state.academy.cases[c.id].note)}</p>`:'').join('')}${state.academy.compare.note?`<h3>月份对照复述</h3><p>${esc(state.academy.compare.note)}</p>`:''}<div class="row">${state.academy.bookmarks.map(id=>{const q=FAQ.find(x=>x.id===id);return q?`<button class="chip" onclick="faqQuery='${q.keys[0]}';go('ask')">${q.q} ↗</button>`:''}).join('')}</div><p class="small muted">案例、复述、收藏、待核问题和复习安排均包含在学习记录备份里。</p><button class="source-button" onclick="go('ask')">查看待核问题 ↗</button></div>`}
function updateRoute(){const routes=new Set(['home','method','courses','lesson','practice','review','notes','sources','cases','compare','sound','today','ask']);const hash=location.hash.slice(1);if(routes.has(hash)){page=hash;render();window.scrollTo(0,0)}else if(hash){page='home';render()}}
function routeWrite(p){if(location.hash.slice(1)!==p)history.replaceState(null,'','#'+p)}
function startAcademy(){updateRoute();window.addEventListener('hashchange',updateRoute)}

render();installPinyin();startAcademy();
</script></body></html>
